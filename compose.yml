services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowtrace
      POSTGRES_USER: flowtrace
      POSTGRES_PASSWORD: flowtrace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowtrace -d flowtrace"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - flowtrace_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      target: dev
    working_dir: /app
    command: sh -c "npm run build -w @flowtrace/shared && npm run build -w @flowtrace/mcp && npm run dev -w @flowtrace/backend"
    environment:
      FLOWTRACE_DATABASE_URL: postgresql://flowtrace:flowtrace@postgres:5432/flowtrace
      FLOWTRACE_HOST: 0.0.0.0
      FLOWTRACE_PORT: 3100
      FLOWTRACE_SEED_DEMO: "true"
      FLOWTRACE_AUTH_SECRET: local-development-only-secret-change-me
      FLOWTRACE_AUTH_BASE_URL: http://localhost:5173
      FLOWTRACE_AUTH_TRUSTED_ORIGINS: http://localhost:5173
      FLOWTRACE_AUTH_PROVIDER: local
    ports:
      - "3100:3100"
    volumes:
      - ./packages:/app/packages
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: dev
    working_dir: /app
    command: sh -c "npm run build -w @flowtrace/shared && npm run dev -w @flowtrace/web"
    environment:
      FLOWTRACE_API_PROXY: http://backend:3100
    ports:
      - "5173:5173"
    volumes:
      - ./packages:/app/packages
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    depends_on:
      backend:
        condition: service_started

volumes:
  flowtrace_postgres_data:
