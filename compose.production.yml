services:
  postgres:
    image: ${FLOWTRACE_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FLOWTRACE_POSTGRES_DATABASE:-flowtrace}
      POSTGRES_USER: ${FLOWTRACE_POSTGRES_USER:-flowtrace}
      POSTGRES_PASSWORD: ${FLOWTRACE_POSTGRES_PASSWORD:?FLOWTRACE_POSTGRES_PASSWORD must be set}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${FLOWTRACE_POSTGRES_USER:-flowtrace} -d ${FLOWTRACE_POSTGRES_DATABASE:-flowtrace}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - flowtrace_postgres_data:/var/lib/postgresql/data

  flowtrace:
    image: ${FLOWTRACE_IMAGE:-flowtrace:local}
    build:
      context: .
      target: app-runtime
    init: true
    restart: unless-stopped
    environment:
      FLOWTRACE_DATABASE_HOST: postgres
      FLOWTRACE_DATABASE_NAME: ${FLOWTRACE_POSTGRES_DATABASE:-flowtrace}
      FLOWTRACE_DATABASE_USER: ${FLOWTRACE_POSTGRES_USER:-flowtrace}
      FLOWTRACE_DATABASE_PASSWORD: ${FLOWTRACE_POSTGRES_PASSWORD:?FLOWTRACE_POSTGRES_PASSWORD must be set}
      FLOWTRACE_HOST: 0.0.0.0
      FLOWTRACE_PORT: 3100
      FLOWTRACE_SEED_DEMO: "false"
      FLOWTRACE_AUTH_SECRET: ${FLOWTRACE_AUTH_SECRET:?FLOWTRACE_AUTH_SECRET must be set}
      FLOWTRACE_AUTH_BASE_URL: ${FLOWTRACE_AUTH_BASE_URL:-}
      FLOWTRACE_AUTH_ALLOWED_HOSTS: ${FLOWTRACE_AUTH_ALLOWED_HOSTS:-}
      FLOWTRACE_AUTH_PROTOCOL: ${FLOWTRACE_AUTH_PROTOCOL:-}
      FLOWTRACE_AUTH_FALLBACK_URL: ${FLOWTRACE_AUTH_FALLBACK_URL:-}
      FLOWTRACE_AUTH_TRUSTED_ORIGINS: ${FLOWTRACE_AUTH_TRUSTED_ORIGINS:-}
      FLOWTRACE_AUTH_PROVIDER: ${FLOWTRACE_AUTH_PROVIDER:?FLOWTRACE_AUTH_PROVIDER must be set}
      FLOWTRACE_OIDC_ISSUER: ${FLOWTRACE_OIDC_ISSUER:-}
      FLOWTRACE_OIDC_CLIENT_ID: ${FLOWTRACE_OIDC_CLIENT_ID:-}
      FLOWTRACE_OIDC_CLIENT_SECRET: ${FLOWTRACE_OIDC_CLIENT_SECRET:-}
      FLOWTRACE_OIDC_NAME: ${FLOWTRACE_OIDC_NAME:-}
      FLOWTRACE_WECOM_CORP_ID: ${FLOWTRACE_WECOM_CORP_ID:-}
      FLOWTRACE_WECOM_AGENT_ID: ${FLOWTRACE_WECOM_AGENT_ID:-}
      FLOWTRACE_WECOM_SECRET: ${FLOWTRACE_WECOM_SECRET:-}
      FLOWTRACE_WECOM_SCOPE: ${FLOWTRACE_WECOM_SCOPE:-snsapi_privateinfo}
    ports:
      - "${FLOWTRACE_PUBLISH_HOST:-127.0.0.1}:${FLOWTRACE_PUBLISH_PORT:-3100}:3100"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  flowtrace_postgres_data:
