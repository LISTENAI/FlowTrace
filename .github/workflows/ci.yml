name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowtrace_test
          POSTGRES_USER: flowtrace_test
          POSTGRES_PASSWORD: flowtrace_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U flowtrace_test -d flowtrace_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: PostgreSQL integration
        run: npm run test -w @flowtrace/backend
        env:
          FLOWTRACE_TEST_DATABASE_URL: postgresql://flowtrace_test:flowtrace_test@127.0.0.1:5432/flowtrace_test

      - name: Build
        run: npm run build

      - name: Build application image
        run: docker build --target app-runtime --tag flowtrace:ci .
